          box-shadow: 4px 0 24px rgba(0, 0, 0, 0.15);
        }
        .main {
          margin-left: 0 !important;
          width: 100%;
        }
        .topbar {
          padding: 0 16px;
        }
        .page-content {
          padding: 16px !important;
        }
        .section-header {
          flex-direction: column !important;
          align-items: flex-start !important;
          gap: 12px !important;

        .table-toolbar {
          flex-direction: column !important;
          align-items: stretch !important;
          gap: 10px !important;

        .search-box {
          width: 100%;
        }
        .search-box input {
          width: 100%;
        }
        .table-wrap {
          overflow-x: auto;
        }
        table {
          min-width: 500px;
        }
      }
    </style>

            width="15"

    <div class="main">
      <div class="topbar">
        <button
          class="hamburger"
          onclick="openSidebar()"
          aria-label="Open menu"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <div class="topbar-title">Bank Details</div>
        <div class="topbar-right">
          <span style="font-size: 12px; color: var(--muted); font-weight: 500"
            >Admin</span
          >
          <div class="avatar">A</div>
        </div>
      </div>

      <div class="page-content">
        <div class="section-header">
          <div>
            <div class="section-title" style="font-size: 18px">
              Bank Details
            </div>
            <div style="font-size: 12px; color: var(--muted); margin-top: 2px">
              Review and verify user banking information
            </div>
          </div>
          <button
            class="btn btn-outline btn-sm"
            onclick="exportCSV('bankTable', 'banks')"
          >
            <svg
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            Export CSV
          </button>
        </div>

        <div class="table-wrap">
          <div class="table-toolbar">
            <div class="search-box">
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="var(--muted)"
                stroke-width="2"
              >
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <input
                type="text"
                placeholder="Search bank details..."
                oninput="filterTable(this, 'bankTable')"
              />
            </div>
          </div>
          <table id="bankTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>User ID</th>
                <th>Bank</th>
                <th>Account No.</th>
                <th>BVN</th>
                <th>Verified</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="banksBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const API = "../api";

      function openSidebar() {
        document.getElementById("sidebar").classList.add("open");
        document.getElementById("navOverlay").classList.add("open");
        document.body.style.overflow = "hidden";
      }
      function closeSidebar() {
        document.getElementById("sidebar").classList.remove("open");
        document.getElementById("navOverlay").classList.remove("open");
        document.body.style.overflow = "";
      }
      function filterTable(input, tableId) {
        const q = input.value.toLowerCase();
        document
          .getElementById(tableId)
          .querySelectorAll("tbody tr")
          .forEach((r) => {
            r.style.display = r.textContent.toLowerCase().includes(q)
              ? ""
              : "none";
          });
      }
      function exportCSV(tableId, name) {
        const table = document.getElementById(tableId);
        const rows = [...table.querySelectorAll("tr")];
        const csv = rows
          .map((r) =>
            [...r.querySelectorAll("th,td")]
              .slice(0, -1)
              .map((c) => `"${c.textContent.trim()}"`)
              .join(",")
          )
          .join("\n");
        const a = document.createElement("a");
        a.href = "data:text/csv," + encodeURIComponent(csv);
        a.download = name + "_export.csv";
        a.click();
      }

      async function setBankVerified(id, value) {
        const label = value ? "Verify" : "Revoke";
        if (!confirm(`${label} this bank detail?`)) return;
        try {
          const res = await fetch(`${API}/updateBankDetail.php`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id, isVerified: value })
          });
          const data = await res.json();
          if (data.success) loadBanks();
          else alert("Failed: " + (data.message || ""));
        } catch (e) {
          alert("Server error");
        }
      }

      async function loadBanks() {
        try {
          const res = await fetch(`${API}/getBankDetails.php`);
          const banks = await res.json();
          const tbody = document.getElementById("banksBody");
          tbody.innerHTML = "";
          banks.forEach((bank) => {
            const isVerified = bank.isVerified == 1;
            const verifiedBadge = isVerified
              ? `<span class="badge badge-green">Verified</span>`
              : `<span class="badge badge-red">Unverified</span>`;
            const actionBtn = isVerified
              ? `<button class="btn btn-danger btn-sm" onclick="setBankVerified(${bank.id},0)">Revoke</button>`
              : `<button class="btn btn-primary btn-sm" onclick="setBankVerified(${bank.id},1)">Verify</button>`;
            const bvn = bank.bvn ? "•••••••" + String(bank.bvn).slice(-4) : "—";
            tbody.insertAdjacentHTML(
              "beforeend",
              `
          <tr>
            <td style="color:var(--muted);font-size:12px">#${bank.id}</td>
            <td><a href="users.html" style="color:var(--accent);font-weight:600;text-decoration:none">#${bank.userId}</a></td>
            <td style="font-weight:600">${bank.bankName ?? "—"}</td>
            <td><span style="font-family:monospace;font-size:13px">${bank.accountNumber ?? "—"}</span></td>
            <td><span style="font-family:monospace;font-size:12px;color:var(--muted)">${bvn}</span></td>
            <td>${verifiedBadge}</td>
            <td>${actionBtn}</td>
          </tr>`
            );
          });
        } catch (e) {
          console.error("Error loading bank details:", e);
        }
      }

      function logout() {
        if (!confirm("Log out?")) return;
        localStorage.removeItem("adminToken");
        window.location.href = "../login.html";
      }

      document.addEventListener("DOMContentLoaded", loadBanks);
    </script>
  </body>
