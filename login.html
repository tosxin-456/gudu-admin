<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Outfit", sans-serif;
        min-height: 100vh;
        display: flex;
        background: #f0f4ff;
      }

      /* Left decorative panel */
      .panel {
        display: none;
        width: 42%;
        background: linear-gradient(
          150deg,
          #127e1f 0%,
          #0a5007 60%,
          #0c571b 100%
        );
        position: relative;
        overflow: hidden;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 50px;
      }

      @media (min-width: 900px) {
        .panel {
          display: flex;
        }
      }

      .panel::before {
        content: "";
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.05);
        top: -80px;
        left: -80px;
      }
      .panel::after {
        content: "";
        position: absolute;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.05);
        bottom: -60px;
        right: -60px;
      }

      .panel-content {
        position: relative;
        z-index: 1;
        text-align: center;
      }

      .panel-icon {
        width: 72px;
        height: 72px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 28px;
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .panel h2 {
        font-size: 28px;
        font-weight: 700;
        color: white;
        margin-bottom: 12px;
        line-height: 1.3;
      }

      .panel p {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.65);
        line-height: 1.7;
        font-weight: 300;
      }

      .dots {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 40px;
      }
      .dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
      }
      .dots span:first-child {
        background: white;
        width: 24px;
        border-radius: 4px;
      }

      /* Right form section */
      .form-section {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
      }

      .card {
        width: 100%;
        max-width: 400px;
        animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 40px;
      }

      .brand-icon {
        width: 36px;
        height: 36px;
        background: #127e1f;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 12px rgba(4, 62, 19, 0.35);
      }

      .brand-name {
        font-size: 17px;
        font-weight: 700;
        color: #111827;
        letter-spacing: -0.3px;
      }

      h1 {
        font-size: 27px;
        font-weight: 700;
        color: #111827;
        margin-bottom: 6px;
        letter-spacing: -0.4px;
      }

      .subtitle {
        font-size: 14.5px;
        color: #6b7280;
        margin-bottom: 36px;
        font-weight: 400;
      }

      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #374151;
        margin-bottom: 7px;
      }

      .input-wrap {
        position: relative;
      }

      .input-wrap .icon {
        position: absolute;
        left: 13px;
        top: 50%;
        transform: translateY(-50%);
        color: #9ca3af;
        pointer-events: none;
        transition: color 0.2s;
      }

      input[type="email"],
      input[type="password"],
      input[type="text"] {
        width: 100%;
        padding: 12px 14px 12px 40px;
        background: white;
        border: 1.5px solid #e5e7eb;
        border-radius: 10px;
        color: #111827;
        font-family: "Outfit", sans-serif;
        font-size: 14.5px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        outline: none;
      }

      input[type="email"]::placeholder,
      input[type="password"]::placeholder,
      input[type="text"]::placeholder {
        color: #c4c9d4;
      }

      input[type="email"]:focus,
      input[type="password"]:focus,
      input[type="text"]:focus {
        border-color: #127e1f;
        box-shadow: 0 0 0 3px rgba(18, 126, 31, 0.1);
      }

      .input-wrap:focus-within .icon {
        color: #127e1f;
      }

      .toggle-pw {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        color: #9ca3af;
        display: flex;
        align-items: center;
        transition: color 0.2s;
        width: auto;
      }
      .toggle-pw:hover {
        color: #127e1f;
      }

      .extras {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
        margin-top: 4px;
      }

      .remember {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 13.5px;
        color: #6b7280;
        cursor: pointer;
      }

      .remember input[type="checkbox"] {
        width: 16px;
        height: 16px;
        padding: 0;
        accent-color: #127e1f;
        cursor: pointer;
      }

      .forgot {
        font-size: 13.5px;
        color: #127e1f;
        text-decoration: none;
        font-weight: 500;
      }
      .forgot:hover {
        text-decoration: underline;
      }

      .btn {
        width: 100%;
        padding: 13.5px;
        background: #127e1f;
        border: none;
        border-radius: 10px;
        color: white;
        font-family: "Outfit", sans-serif;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 0.1px;
        transition:
          background 0.2s,
          transform 0.15s,
          box-shadow 0.2s;
        box-shadow: 0 4px 16px rgba(18, 126, 31, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn:hover:not(:disabled) {
        background: #0b400f;
        box-shadow: 0 6px 20px rgba(18, 126, 31, 0.45);
        transform: translateY(-1px);
      }

      .btn:active:not(:disabled) {
        transform: translateY(0);
      }
      .btn:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .spinner {
        width: 17px;
        height: 17px;
        border: 2.5px solid rgba(255, 255, 255, 0.35);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.65s linear infinite;
        flex-shrink: 0;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .message {
        margin-top: 16px;
        font-size: 13.5px;
        text-align: center;
        border-radius: 8px;
        min-height: 16px;
      }

      .message.error {
        color: #dc2626;
        background: #fef2f2;
        border: 1px solid #fecaca;
        padding: 10px 14px;
        animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97);
      }

      .message.success {
        color: #16a34a;
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        padding: 10px 14px;
      }

      @keyframes shake {
        10%,
        90% {
          transform: translateX(-2px);
        }
        20%,
        80% {
          transform: translateX(3px);
        }
        30%,
        50%,
        70% {
          transform: translateX(-4px);
        }
        40%,
        60% {
          transform: translateX(4px);
        }
      }

      .footer {
        margin-top: 32px;
        padding-top: 22px;
        border-top: 1px solid #f3f4f6;
        text-align: center;
        font-size: 12.5px;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <!-- Left Panel -->
    <div class="panel">
      <div class="panel-content">
        <div class="panel-icon">
          <svg
            width="32"
            height="32"
            fill="none"
            viewBox="0 0 24 24"
            stroke="white"
            stroke-width="1.8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"
            />
          </svg>
        </div>
        <h2>Admin Control Panel</h2>
        <p>Manage your platform, users, and settings from one secure place.</p>
        <div class="dots"><span></span><span></span><span></span></div>
      </div>
    </div>

    <!-- Right Form -->
    <div class="form-section">
      <div class="card">
        <div class="brand">
          <div class="brand-icon">
            <svg
              width="18"
              height="18"
              fill="none"
              viewBox="0 0 24 24"
              stroke="white"
              stroke-width="2.2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"
              />
            </svg>
          </div>
          <span class="brand-name">AdminPortal</span>
        </div>

        <h1>Sign in</h1>
        <p class="subtitle">Enter your credentials to access the dashboard.</p>

        <div class="field">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <svg
              class="icon"
              width="16"
              height="16"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"
              />
            </svg>
            <input
              type="email"
              id="email"
              placeholder="admin@example.com"
              autocomplete="email"
            />
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg
              class="icon"
              width="16"
              height="16"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"
              />
            </svg>
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
            <button
              class="toggle-pw"
              type="button"
              onclick="togglePw()"
              title="Show/hide password"
            >
              <svg
                id="eye-icon"
                width="15"
                height="15"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="extras">
          <label class="remember">
            <input type="checkbox" id="remember" /> Remember me
          </label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>

        <button class="btn" id="loginBtn" onclick="login()">Sign In</button>

        <div class="message" id="message"></div>

        <div class="footer">
          Secure admin access · Authorised personnel only
        </div>
      </div>
    </div>

    <script>
      const API_BASE = "./api";

      function togglePw() {
        const pw = document.getElementById("password");
        pw.type = pw.type === "password" ? "text" : "password";
      }

      function setMessage(text, type) {
        const el = document.getElementById("message");
        el.textContent = text;
        el.className = "message " + type;
      }

      function clearMessage() {
        const el = document.getElementById("message");
        el.textContent = "";
        el.className = "message";
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") login();
      });

      async function login() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const btn = document.getElementById("loginBtn");

        clearMessage();

        if (!email || !password) {
          setMessage("Please enter your email and password.", "error");
          return;
        }

        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div> Signing in…';

        try {
          const res = await fetch(`${API_BASE}/login.php`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            // credentials: "include", // uncomment if your API uses cookies
            body: JSON.stringify({ email, password })
          });

          let data = {};
          const ct = res.headers.get("content-type") || "";
          if (ct.includes("application/json")) {
            data = await res.json();
          }

          if (!res.ok) {
            setMessage(
              data.message || "Invalid credentials. Please try again.",
              "error"
            );
            return;
          }

          if (data.token) {
            localStorage.setItem("adminToken", data.token);
          }

          setMessage("Login successful — redirecting…", "success");

          setTimeout(() => {
            window.location.href = "admin/dashboard.html";
          }, 1100);
        } catch (err) {
          if (err instanceof TypeError) {
            setMessage(
              "Cannot reach the server. Check your connection or CORS settings.",
              "error"
            );
          } else {
            setMessage(
              "An unexpected error occurred. Please try again.",
              "error"
            );
          }
          console.error("Login error:", err);
        } finally {
          btn.disabled = false;
          btn.innerHTML = "Sign In";
        }
      }
    </script>
  </body>
</html>
